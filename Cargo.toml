[workspace]
resolver = "2"
members = ["crates/sh_nexus", "crates/sh_nexus_wire", "crates/sh_nexus_server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Must match the root LICENSE file (MIT, Copyright (c) 2026 Adrián Quirós).
# This was previously "Apache-2.0", which contradicted the LICENSE. GPUI itself
# is Apache-2.0 (see the pin note below) but that license attaches to the
# dependency, not to this project.
license = "MIT"
publish = false

# GPUI is pulled from Zed Industries' monorepo via a pinned `rev`, not from
# crates.io. The published `gpui` crate (0.2.2, last published 2025-10-22)
# ships no Windows platform backend and its README states macOS/Linux only, so
# it cannot satisfy this project's targets. See PLAN.md section 1 (ADR-001).
#
# Upstream commit: e683fd7b465ecfb42b1da88ff685d204c2781076
#   date:    2026-09-27T17:37:29Z
#   subject: "gpui: Add bench_metrics for multi-metric Criterion benchmarks (#64753)"
#   license: Apache-2.0
#
# Upstream release context: Zed 1.19.1 (2026-09-04), per zed.dev.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "e683fd7b465ecfb42b1da88ff685d204c2781076" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e683fd7b465ecfb42b1da88ff685d204c2781076" }

# ---------------------------------------------------------------------------
# PHASE 1 / WORK UNIT 1A -- the pure-Rust type foundation
# ---------------------------------------------------------------------------
#
# Every crate below already appears in `Cargo.lock` transitively through GPUI's
# tree, so adding them as direct dependencies costs no new download and no new
# build of the 675-package dependency graph. Each is audited against
# `AGENTS.md` 7.2's five criteria below; the full audit table is
# `docs/DEPENDENCIES.md`, a Phase 1 exit criterion (PLAN.md section 2).
#
# Criterion 5 (`cargo build --timings` delta) for all of these is "no
# measurable delta": the crates were already compiled as part of GPUI's tree
# before they were named here. Only the compile *units* for the two new
# workspace crates are new, and they are recorded in the Phase 1 timings pass.
#
# ---------------------------------------------------------------------------
# serde 1.0.229 | MIT OR Apache-2.0 | maintained (1.0.229 is current) | millions
#   of downloads/month | last commit well inside 6 months | no new compile units.
#   Criterion 1: `AGENTS.md` 2.2 names serde explicitly as the project's
#   serialization tool, and `PLAN.md` 2 lists it. Not a preference -- a mandate.
#   Used ONLY by `sh_nexus_wire`, the crate whose entire purpose is a
#   serialization format. The client crate does not depend on it, because
#   `core/models` must not know that serialization exists (PLAN.md section 5).
# ---------------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }

# ---------------------------------------------------------------------------
# serde_json 1.0.151 | MIT OR Apache-2.0 | maintained | millions of
#   downloads/month | recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.2 names serde_json explicitly; `PLAN.md` 2 lists
#   it. The standard Rust JSON implementation, with no C dependency and no
#   build script, so `AGENTS.md` 7.1's "no JavaScript, no WASM, no web tech" is
#   untouched -- JSON here is a wire encoding, not a web technology.
# ---------------------------------------------------------------------------
serde_json = "1"

# ---------------------------------------------------------------------------
# chrono 0.4.45 | MIT OR Apache-2.0 | maintained | millions of downloads/month |
#   recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.1 requires `chrono::DateTime<Utc>` for all
#   timestamps and PLAN.md 3 forbids hand-formatted RFC-3339. chrono is the
#   only crate that satisfies that; `std` time cannot do timezone-aware UTC
#   arithmetic or RFC-3339 round-tripping.
#   Feature choice: `default-features = false` with `["std", "serde"]` here, and
#   `crates/sh_nexus/Cargo.toml` adds `clock` for itself. The default set is
#   `["clock", "std", "oldtime", "wasmbind"]`; `clock` pulls `iana-time-zone` and
#   `Utc::now()`.
#   `clock` was excluded because work unit 1A needed neither, and excluding it
#   kept timestamp *validation* pure and deterministic -- see the
#   `timestamp_floor`/`timestamp_ceiling` rules in `network/mapping.rs`, whose
#   tests would otherwise depend on a wall clock. It is now needed, and the
#   reason is narrow: `ui/views/input_bar.rs` calls `Utc::now()` when Enter
#   mints a send, because `AGENTS.md` 3.2 gives `state/` no clock and
#   `bridge.rs` assigns the timestamp to the *caller*.
#   The determinism argument still holds where it was written, because the
#   *wire* crate keeps `["std", "serde"]` -- `cargo metadata` shows
#   `sh_nexus_wire` with no `clock` -- and `network/mapping.rs` does not read a
#   clock. Adding `clock` to the client does not make a validation deterministic
#   by depending on anything new; it names the one call site that exists.
#   The honest part: `Utc::now()` compiled here before `clock` was declared,
#   because gpui enables chrono's `default` features and features unify per
#   crate version. The previous version of this comment said so and then treated
#   it as acceptable; it is the reason the feature is declared explicitly now.
# ---------------------------------------------------------------------------
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# ---------------------------------------------------------------------------
# uuid 1.26.1 | MIT OR Apache-2.0 | maintained | millions of downloads/month |
#   recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 7.4 requires a client-generated UUID
#   (`client_msg_id`) on every client frame, and `PLAN.md` 2 lists uuid.
#   Feature choice: defaults only (`std`) here; `crates/sh_nexus/Cargo.toml`
#   adds `v4` for itself. The `v4`/`rng` features were NOT enabled through work
#   unit 1A because no production code generated an id: the 1A tests built ids
#   deterministically from `Uuid::from_bytes`, which is better test hygiene than
#   a random id per assertion, and this comment said `rng` "will be added when
#   the first real generator lands, as its own justified change".
#   That generator is `ui/views/input_bar.rs`: Enter mints the `client_msg_id`
#   for the optimistic row, because `bridge.rs` states the bridge has no id
#   source and the caller mints it. `v4` implies `rng`, which is a `getrandom`
#   call per generated id -- one per Enter, not per frame. The alternative, a
#   counter through `from_u128`, is an identity the server would have to trust
#   and would collide across two clients.
#   `serde` is still not needed: the wire crate carries `client_msg_id` as a
#   `String` and the boundary parses it, so the wire layer holds no uuid.
#   The honest part, and the reason the feature is declared explicitly rather
#   than left to unify: `Uuid::new_v4()` compiled here before `v4` was
#   declared, because gpui's tree enables `uuid/v4`. A declaration that says
#   nothing while the build depends on someone else's is not a declaration.
# ---------------------------------------------------------------------------
uuid = "1"

# ---------------------------------------------------------------------------
# smallvec 1.16.2 | MIT OR Apache-2.0 | maintained | millions of
#   downloads/month | recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.3 mandates `SmallVec` for small collections and
#   names "reactions on a message" as the case; `PLAN.md` 5 sizes the inline
#   buffers at `[Reaction; 2]` and `[Attachment; 1]`. smallvec has no
#   dependencies, no build script, and no C code, and the crate defines no
#   default features, so `smallvec = "1"` is already the minimal declaration.
#   Only the client crate uses it; the wire crate uses `Vec`, so the DTOs stay
#   free of the domain's memory-layout opinions and the conversion at
#   `network/mapping.rs` is doing real work.
# ---------------------------------------------------------------------------
smallvec = "1"

# ---------------------------------------------------------------------------
# thiserror 2.0.21 | MIT OR Apache-2.0 | maintained | millions of
#   downloads/month | recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.2 mandates thiserror, 3.3 specifies
#   `ShNexusError` as a `#[derive(Error)]` enum, and `PLAN.md` 2 records the
#   mandate. A hand-written `Display` + `Error` impl for a nine-variant enum
#   is strictly worse: thiserror generates it from the same `#[error]`
#   attributes the constitution's snippet already uses.
# ---------------------------------------------------------------------------
thiserror = "2"

# ---------------------------------------------------------------------------
# proptest 1.11.0 | MIT OR Apache-2.0 | maintained | hundreds of thousands of
#   downloads/month | recent commits | no new compile units for the
#   `std`-only feature set.
#   Criterion 1: `AGENTS.md` 4.4 mandates proptest, and 4.3 forbids `sleep()`
#   in unit tests, which rules out the ad-hoc loops a property test replaces.
#   Feature choice: `default-features = false, features = ["std"]`. The default
#   set adds `fork` and `timeout`, which pull `rusty-fork` and `tempfile` for
#   on-disk persistence of failing seeds -- 1A's properties are pure functions
#   over values, so a failing case is reproducible from proptest's own printed
#   seed and persistence buys nothing.
#   COST, stated plainly: `gpui_platform/test-support` already pulls a *second*
#   copy of proptest, from Zed's git pin rather than crates.io. Two copies of
#   a test-only crate is the price of not inheriting a git dependency of our
#   own, and it does not reach any release artifact -- `proptest` is a
#   dev-dependency of both crates and `sh_nexus_wire` is a library the binary
#   links only through `sh_nexus`.
# ---------------------------------------------------------------------------
proptest = { version = "1", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# rstest 0.27.0 | MIT OR Apache-2.0 | maintained (0.27.0 published
#   2026-09-06) | 28,006,626 downloads in the last 90 days | MSRV 1.85.0
#   against our 1.99.0 | crate size 57,880 bytes.
#   Criterion 1: `AGENTS.md` 4.3 names `rstest` or `test-case` as THE tool for
#   parameterized tests. That is the constitution answering the question, not a
#   preference, so criterion 1 is satisfied by citing it. Criterion 5: exactly
#   ONE new compile unit, `rstest_macros`, a proc-macro crate. The other two
#   runtime dependencies are optional and stay off -- they exist for rstest's
#   async support and this project has no async tests.
#
#   See `docs/ARCHITECTURE.md` ADR-008, which records why work unit 1A's
#   std `for` loops did NOT satisfy 4.3 and why they are grandfathered rather
#   than rewritten.
# ---------------------------------------------------------------------------
rstest = "0.27"

# ===========================================================================
# PHASE 3 -- sh_nexus_server's dependencies
# ===========================================================================
#
# These are the FIRST additions to this workspace that were not already in
# `Cargo.lock` through GPUI's tree. Criterion 5 therefore applies for real here,
# and criterion 1 ("verify no solution exists with current dependencies or std")
# is answered by `docs/ARCHITECTURE.md` ADR-010's alternatives section rather
# than by preference.
#
# Every version is the newest published as of 2026-10-03, read from the
# crates.io index and confirmed unyanked. Every license is MIT or MIT OR
# Apache-2.0, compatible with this project's MIT.

# axum 0.8.9 | MIT | actively maintained | crates.io, 400M+ downloads in 90 days.
#   Criterion 1: `PLAN.md` ADR-002 already decided the backend is Axum, and
#   `AGENTS.md` 7.4 requires versioned frames with header and upgrade validation.
#   Criterion 5: a real new subtree -- hyper, tower, http, h2, tungstenite and
#   their trees. It is the cost of ADR-002 and is named as such rather than
#   discovered later.
#   Criterion 6: no C dependencies. Pure Rust.
axum = { version = "0.8", features = ["ws"] }

# tokio-tungstenite 0.29.0 | MIT OR Apache-2.0 | actively maintained |
#   crates.io, hundreds of thousands of downloads per month | no C, no build
#   script, no proc-macros.
#
#   Criterion 1: `AGENTS.md` 3.1 names `network/websocket.rs` as the client's
#   transport module and 7.4 requires "timeouts on everything: connect (5s),
#   read (30s keepalive -> ping)" plus explicit rejection of an unknown major
#   version -- neither of which is expressible without a WebSocket
#   implementation. `std` has none, and hand-rolling RFC 6455 is the exact case
#   the criterion exists to exclude. This is the client half of ADR-002: the
#   *protocol* is already shared through `sh_nexus_wire`, and this is the
#   *transport* each side speaks it over.
#
#   NO NEW DOWNLOAD, and this is the strongest claim in this file. At the time of
#   this entry `Cargo.lock` already held tokio-tungstenite 0.29.0 and tungstenite
#   0.29.0, because `axum`'s `ws` feature above depends on them -- the server
#   drives tungstenite through axum's WebSocket wrapper. Naming it here converts
#   an already-compiled transitive dependency into a declared one, on the same
#   reasoning already recorded for `chrono/clock` and `uuid/v4` below and for
#   `tokio` itself above: a declaration that says nothing while the build depends
#   on someone else's feature set is not a declaration. Criterion 5 is therefore
#   "no new compile units", not "small".
#
#   Feature choice: defaults (`connect`, `handshake`) and nothing else. Every TLS
#   feature is deliberately OFF. `native-tls` and `rustls-tls-*` would each pull a
#   trust store and a TLS stack into the client, and `AGENTS.md` 7.4's "TLS
#   certificate validation must never be disabled in release builds" is a rule
#   about a stack this client does not have yet -- ADR-010's next PR adds auth
#   over TLS and audits the root store with it. `url` is off for the same reason
#   as `pulldown-cmark/html`: it exists to serve a helper this client does not
#   call. `tokio/net` arrives through `connect`.
tokio-tungstenite = { version = "0.29" }

# tokio 1.53.2 | MIT | the runtime GPUI already uses.
#   Criterion 1: `AGENTS.md` 7.2/2.3 mandate tokio for async, and gpui's tree
#   already depends on it, so this names a dependency the workspace already
#   links rather than adding one -- the same reasoning recorded for
#   `chrono/clock` and `uuid/v4` above.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }

# rusqlite 0.40.2 | MIT | actively maintained | SQLite bindings, no ORM.
#   Criterion 1: ADR-010 chose SQLite over Postgres because a team is tens to
#   hundreds of users and a backup is a file copy. An ORM is NOT taken: the
#   query surface is four statements and sqlx's async story buys nothing SQLite's
#   own concurrency model does not already give.
#   Criterion 5: `bundled` compiles SQLite from C source -- the one C dependency
#   in this workspace, and it is the reason a system SQLite is not required on
#   the machines this must install on. Named explicitly rather than glossed.
rusqlite = { version = "0.40", features = ["bundled"] }

# tracing 0.1 / tracing-subscriber 0.3 | MIT OR Apache-2.0 | the Rust logging
#   standard.
#   Criterion 1: `AGENTS.md` 7.5 requires `tracing` over `println!` and 7.1 bans
#   `println!` in production. A server that logs to stdout unstructured cannot
#   satisfy 7.5's level table, so this is the rule becoming implementable.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---------------------------------------------------------------------------
# pulldown-cmark 0.13.4 | MIT | actively maintained (0.13.4 released
#   2026-05-20) | 48,413,256 downloads in the last 90 days | MSRV 1.71.1
#   against our 1.99.0 | crate size 155,043 bytes.
#
#   Criterion 1 -- "verify no solution exists with current dependencies or the
#   std library". Nothing else in this tree parses CommonMark: `AGENTS.md` 4.2
#   names a mandatory test target of "markdown bold/italic/code/links, nested
#   formatting, never panics, injection safety", and `PLAN.md` 2 already lists
#   `pulldown-cmark` in the tech stack and 8 Phase 1 already names
#   `core/markdown.rs` as "Markdown to styled segment tree". Hand-rolling a
#   CommonMark parser is the exact case the criterion exists to exclude, and it
#   would be the one module in the workspace whose correctness is argued rather
#   than tested. This declaration closes a gap `PLAN.md` 2 had already recorded.
#
#   Criterion 2 -- maintained: released 2026-05-20, the most recent 0.13.x, and
#   the crate the entire Rust Markdown ecosystem (including Zed itself, whose
#   own markdown rendering is built on it) depends on.
#
#   Criterion 3 -- license: `MIT`, confirmed in BOTH the repository `LICENSE`
#   file and the published crate's `license` field. MIT is one of the licenses
#   `AGENTS.md` 7.2 names as compatible, and this project's own LICENSE is MIT
#   (root `Cargo.toml` `workspace.package.license`, which the `rstest` block
#   above records was corrected to match the LICENSE file).
#
#   Criterion 4 -- compile-time impact, and this is the figure that differs from
#   every other entry in this file: `AGENTS.md` 7.2's usual "no new compile
#   units, it was already in the tree via GPUI" argument does NOT apply. At 1C-1
#   `Cargo.lock` held no `pulldown-cmark` and no `unicase`; `bitflags 2.13.2`
#   and `memchr 2.8.3` were already present transitively. So the honest figure
#   is TWO new compile units -- `pulldown-cmark` itself and `unicase`, pulled
#   in by the `getopts` feature and needed for case-insensitive HTML tag-name
#   matching. Measured in the Phase 1 timings pass. Both are small, pure Rust,
#   no C, no build script, no proc-macros.
#
#   Criterion 5 -- justification comment: this one.
#
#   Feature choice: `default-features = false`, and this is the interesting
#   decision. The default set is `["getopts", "html"]`. `html` pulls
#   `pulldown-cmark-escape` and exists solely to serve `pulldown_cmark::html`,
#   the HTML *renderer* -- a thing this project does not have and must not want:
#   `PLAN.md` 2's row is "Markdown parsing into a styled segment tree", and
#   `ui/` renders GPUI elements, not HTML. Enabling it would add a dependency
#   whose sole purpose is to escape text for a renderer we do not ship.
#   `getopts` compiles a small command-line flag parser that is only reachable
#   from the crate's `pulldown-cmark` binary target, which a library dependency
#   does not build. Both stay off deliberately, and `getopts` being off does not
#   remove `unicase` (see the criterion-4 note: it is a non-optional runtime
#   dependency).
# ---------------------------------------------------------------------------
pulldown-cmark = { version = "0.13", default-features = false }

# ===========================================================================
# PHASE 3 -- the AUTH milestone's two dependencies
# ===========================================================================
#
# `argon2` and `sha2` are, unlike almost every entry above, GENUINELY NEW TO
# `Cargo.lock`. The record matters because it is the honest counterweight to the
# `tokio-tungstenite` entry above, which claimed "no new download" because axum's
# `ws` feature had already pulled it in. Neither crate here is in anyone's tree:
# `Cargo.lock` held no `argon2`, no `sha2`, no `jsonwebtoken`, no `ring`, no
# `rustls` and no `openssl` before this milestone. **That is why criterion 5
# below is a real figure and not "no new compile units", and why it is stated
# here rather than left to be discovered in a CI timings diff.**
#
# Both are RustCrypto crates under MIT OR Apache-2.0, both are pure Rust with no
# C dependency, no build script and no proc-macro, and both are the crates the
# whole Rust ecosystem already depends on for exactly these two jobs. ADR-010
# names `argon2` explicitly, in its Decision section, so criterion 1 for it is a
# citation rather than an argument.

# argon2 0.6.0 | MIT OR Apache-2.0 | actively maintained (RustCrypto
#   `password-hashes`, 0.6.0 is the current release) | tens of millions of
#   downloads/month | MSRV 1.85 against our 1.99.0.
#
#   Criterion 1: `docs/ARCHITECTURE.md` ADR-010's Decision section says, in as
#   many words, "Local accounts with `argon2`, and closed registration", and its
#   Alternatives section rejects "rolling our own password hashing" as the
#   roll-your-own-crypto failure mode. `std` has no memory-hard KDF, and a
#   GPU-parallel SHA-256 loop is not one either. There is no std-library answer
#   to this and there is not meant to be.
#
#   Criterion 5: a REAL new subtree. `argon2` pulls `password-hash` 0.6 (the PHC
#   string format, which is what makes a stored hash self-describing and therefore
#   re-parameterisable without a migration), `base64ct`, `blake2`, and
#   `crypto-common`. All pure Rust. The subtree is small -- `password-hash` is
#   the format layer, not a second crypto library -- and it is deliberately
#   bought: ADR-010's argument is that a per-team self-hosted instance's adversary
#   is *outside* the team, so the credential store is the thing that has to hold.
#
#   Why the PHC string format is worth the extra dependency: `users.password_hash`
#   stores the algorithm, the version, the cost parameters AND the salt inside one
#   TEXT column. That means re-tuning Argon2's memory or iteration count later is
#   a change to which hash new passwords get -- existing hashes keep verifying
#   with the parameters they were made with, and a user is re-hashed on their next
#   successful login. Storing `(hash, salt, m, t, p)` in five columns would make
#   that a data migration over live rows, which is the expensive version of an
#   idea this format makes free.
#
#   Feature choice: DEFAULTS (`alloc`, `getrandom`, `password-hash`). All three
#   are load-bearing and none is optional for this milestone:
#     - `password-hash` is the PHC encoder/decoder -- without it there is no
#       self-describing string, only a raw digest.
#     - `alloc` is required by `password-hash/alloc` for the string form.
#     - `getrandom` is what draws the per-password salt. A fixed salt would be
#       worse than no salt: one precomputed table would then break every password
#       on the instance at once.
#   `parallel` (rayon), `kdf` (PBKDF2/HKDF, an interop surface nothing here needs)
#   and `zeroize` are all OFF: this server keeps no long-lived secret in a buffer
#   that would need wiping, and `rayon` would put a thread pool inside a request
#   path that `AGENTS.md` 2.3 says must not block a runtime worker.
argon2 = "0.6"

# sha2 0.11.0 | MIT OR Apache-2.0 | actively maintained (RustCrypto `hashes`,
#   0.11.0 is the current release) | hundreds of millions of downloads/month |
#   MSRV 1.85 against our 1.99.0.
#
#   Criterion 1: nothing else in this workspace can produce a 32-byte digest.
#   `std` has no cryptographic hash at all, and `sha2`'s output is used here for
#   exactly one thing -- turning a high-entropy session token into the key the
#   `sessions` table is keyed on. See the note below on why that is SHA-256 and
#   not `argon2`, because the answer is counter-intuitive and the wrong choice is
#   the expensive one.
#
#   WHY SHA-256 AND NOT ARGON2 FOR SESSION TOKENS, since both are right here and
#   picking wrongly is a real performance bug:
#
#   The two inputs have opposite threat models. A *password* is low-entropy and
#   chosen by a human, so the hash must be deliberately expensive -- that cost is
#   the entire defence against an offline dictionary attack on a leaked
#   `users.password_hash`. A *session token* is 256 bits of `getrandom`, so there
#   is no dictionary to search: recovering the token from its hash is not a
#   cracking problem, it is a preimage problem over 2^256. Slowing that down buys
#   nothing and costs a great deal, because this hash runs on **every WebSocket
#   handshake** -- and `AGENTS.md` 6.2's budget for that whole path is under
#   16 ms. An Argon2 verification there is ~50 ms of memory-hard work per
#   reconnect, per client, on a thread that is holding a socket. SHA-256 of a
#   64-byte token is a single compression pass: sub-microsecond, and constant
#   time regardless of how much of the token matched.
#
#   So: `argon2` for the thing a human chose, `sha2` for the thing the machine
#   chose, and the split is drawn at "is the input already high-entropy" rather
#   than at "is this a credential". The property that makes the fast path safe is
#   the one `sessions.token_hash` exists for: the database stores the HASH, so a
#   leaked `sh_nexus.db` yields no usable token -- it yields 32-byte digests that
#   cannot be played back into an `Authorization` header.
#
#   Feature choice: `default-features = false` with `alloc`, and the one thing
#   turned off is `oid`. The default set is `["alloc", "oid"]`, and `oid` is the
#   object-identifier registry -- it exists so a hash can be named in an X.509
#   structure. This server names the algorithm in Rust (`Sha256`), and a stored
#   session row names it in a column name. Turning `oid` off is the difference
#   between declaring a hash function and declaring a hash function *as a
#   standard*, and only the first is true here.
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
