[workspace]
resolver = "2"
members = ["crates/sh_nexus", "crates/sh_nexus_wire"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Must match the root LICENSE file (MIT, Copyright (c) 2026 Adrián Quirós).
# This was previously "Apache-2.0", which contradicted the LICENSE. GPUI itself
# is Apache-2.0 (see the pin note below) but that license attaches to the
# dependency, not to this project.
license = "MIT"
publish = false

# GPUI is pulled from Zed Industries' monorepo via a pinned `rev`, not from
# crates.io. The published `gpui` crate (0.2.2, last published 2025-10-22)
# ships no Windows platform backend and its README states macOS/Linux only, so
# it cannot satisfy this project's targets. See PLAN.md section 1 (ADR-001).
#
# Upstream commit: e683fd7b465ecfb42b1da88ff685d204c2781076
#   date:    2026-09-27T17:37:29Z
#   subject: "gpui: Add bench_metrics for multi-metric Criterion benchmarks (#64753)"
#   license: Apache-2.0
#
# Upstream release context: Zed 1.19.1 (2026-09-04), per zed.dev.
[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "e683fd7b465ecfb42b1da88ff685d204c2781076" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "e683fd7b465ecfb42b1da88ff685d204c2781076" }

# ---------------------------------------------------------------------------
# PHASE 1 / WORK UNIT 1A -- the pure-Rust type foundation
# ---------------------------------------------------------------------------
#
# Every crate below already appears in `Cargo.lock` transitively through GPUI's
# tree, so adding them as direct dependencies costs no new download and no new
# build of the 675-package dependency graph. Each is audited against
# `AGENTS.md` 7.2's five criteria below; the full audit table is
# `docs/DEPENDENCIES.md`, a Phase 1 exit criterion (PLAN.md section 2).
#
# Criterion 5 (`cargo build --timings` delta) for all of these is "no
# measurable delta": the crates were already compiled as part of GPUI's tree
# before they were named here. Only the compile *units* for the two new
# workspace crates are new, and they are recorded in the Phase 1 timings pass.
#
# ---------------------------------------------------------------------------
# serde 1.0.229 | MIT OR Apache-2.0 | maintained (1.0.229 is current) | millions
#   of downloads/month | last commit well inside 6 months | no new compile units.
#   Criterion 1: `AGENTS.md` 2.2 names serde explicitly as the project's
#   serialization tool, and `PLAN.md` 2 lists it. Not a preference -- a mandate.
#   Used ONLY by `sh_nexus_wire`, the crate whose entire purpose is a
#   serialization format. The client crate does not depend on it, because
#   `core/models` must not know that serialization exists (PLAN.md section 5).
# ---------------------------------------------------------------------------
serde = { version = "1", features = ["derive"] }

# ---------------------------------------------------------------------------
# serde_json 1.0.151 | MIT OR Apache-2.0 | maintained | millions of
#   downloads/month | recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.2 names serde_json explicitly; `PLAN.md` 2 lists
#   it. The standard Rust JSON implementation, with no C dependency and no
#   build script, so `AGENTS.md` 7.1's "no JavaScript, no WASM, no web tech" is
#   untouched -- JSON here is a wire encoding, not a web technology.
# ---------------------------------------------------------------------------
serde_json = "1"

# ---------------------------------------------------------------------------
# chrono 0.4.45 | MIT OR Apache-2.0 | maintained | millions of downloads/month |
#   recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.1 requires `chrono::DateTime<Utc>` for all
#   timestamps and PLAN.md 3 forbids hand-formatted RFC-3339. chrono is the
#   only crate that satisfies that; `std` time cannot do timezone-aware UTC
#   arithmetic or RFC-3339 round-tripping.
#   Feature choice: `default-features = false` with `["std", "serde"]`.
#   The default set is `["clock", "std", "oldtime", "wasmbind"]`; `clock` pulls
#   `iana-time-zone` and `Utc::now()`, and work unit 1A needs neither. Excluding
#   them also keeps timestamp *validation* pure and deterministic -- see the
#   `timestamp_floor`/`timestamp_ceiling` rules in `network/mapping.rs`, whose
#   tests would otherwise depend on a wall clock. GPUI's own tree may enable
#   `clock` transitively (features unify per-build), so this is a declaration
#   of what THIS crate needs, not a guarantee the binary omits `iana-time-zone`.
# ---------------------------------------------------------------------------
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }

# ---------------------------------------------------------------------------
# uuid 1.26.1 | MIT OR Apache-2.0 | maintained | millions of downloads/month |
#   recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 7.4 requires a client-generated UUID
#   (`client_msg_id`) on every client frame, and `PLAN.md` 2 lists uuid.
#   Feature choice: defaults only (`std`). The `v4`/`rng` features are NOT
#   enabled in 1A: no production code in this unit generates an id -- the
#   generators are `state/actions.rs` and `network/`, which are Phase 4. The
#   1A tests build ids deterministically from `Uuid::from_bytes`, which is
#   better test hygiene than a random id per assertion. `rng` will be added
#   when the first real generator lands, as its own justified change.
#   `serde` is likewise not needed: the wire crate carries `client_msg_id` as a
#   `String` and the boundary parses it, so the wire layer holds no uuid.
# ---------------------------------------------------------------------------
uuid = "1"

# ---------------------------------------------------------------------------
# smallvec 1.16.2 | MIT OR Apache-2.0 | maintained | millions of
#   downloads/month | recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.3 mandates `SmallVec` for small collections and
#   names "reactions on a message" as the case; `PLAN.md` 5 sizes the inline
#   buffers at `[Reaction; 2]` and `[Attachment; 1]`. smallvec has no
#   dependencies, no build script, and no C code, and the crate defines no
#   default features, so `smallvec = "1"` is already the minimal declaration.
#   Only the client crate uses it; the wire crate uses `Vec`, so the DTOs stay
#   free of the domain's memory-layout opinions and the conversion at
#   `network/mapping.rs` is doing real work.
# ---------------------------------------------------------------------------
smallvec = "1"

# ---------------------------------------------------------------------------
# thiserror 2.0.21 | MIT OR Apache-2.0 | maintained | millions of
#   downloads/month | recent commits | no new compile units.
#   Criterion 1: `AGENTS.md` 2.2 mandates thiserror, 3.3 specifies
#   `ShNexusError` as a `#[derive(Error)]` enum, and `PLAN.md` 2 records the
#   mandate. A hand-written `Display` + `Error` impl for a nine-variant enum
#   is strictly worse: thiserror generates it from the same `#[error]`
#   attributes the constitution's snippet already uses.
# ---------------------------------------------------------------------------
thiserror = "2"

# ---------------------------------------------------------------------------
# proptest 1.11.0 | MIT OR Apache-2.0 | maintained | hundreds of thousands of
#   downloads/month | recent commits | no new compile units for the
#   `std`-only feature set.
#   Criterion 1: `AGENTS.md` 4.4 mandates proptest, and 4.3 forbids `sleep()`
#   in unit tests, which rules out the ad-hoc loops a property test replaces.
#   Feature choice: `default-features = false, features = ["std"]`. The default
#   set adds `fork` and `timeout`, which pull `rusty-fork` and `tempfile` for
#   on-disk persistence of failing seeds -- 1A's properties are pure functions
#   over values, so a failing case is reproducible from proptest's own printed
#   seed and persistence buys nothing.
#   COST, stated plainly: `gpui_platform/test-support` already pulls a *second*
#   copy of proptest, from Zed's git pin rather than crates.io. Two copies of
#   a test-only crate is the price of not inheriting a git dependency of our
#   own, and it does not reach any release artifact -- `proptest` is a
#   dev-dependency of both crates and `sh_nexus_wire` is a library the binary
#   links only through `sh_nexus`.
# ---------------------------------------------------------------------------
proptest = { version = "1", default-features = false, features = ["std"] }

# ---------------------------------------------------------------------------
# rstest 0.27.0 | MIT OR Apache-2.0 | maintained (0.27.0 published
#   2026-09-06) | 28,006,626 downloads in the last 90 days | MSRV 1.85.0
#   against our 1.98.1 | crate size 57,880 bytes.
#   Criterion 1: `AGENTS.md` 4.3 names `rstest` or `test-case` as THE tool for
#   parameterized tests. That is the constitution answering the question, not a
#   preference, so criterion 1 is satisfied by citing it. Criterion 5: exactly
#   ONE new compile unit, `rstest_macros`, a proc-macro crate. The other two
#   runtime dependencies are optional and stay off -- they exist for rstest's
#   async support and this project has no async tests.
#
#   See `docs/ARCHITECTURE.md` ADR-008, which records why work unit 1A's
#   std `for` loops did NOT satisfy 4.3 and why they are grandfathered rather
#   than rewritten.
# ---------------------------------------------------------------------------
rstest = "0.27"

# ---------------------------------------------------------------------------
# pulldown-cmark 0.13.4 | MIT | actively maintained (0.13.4 released
#   2026-05-20) | 48,413,256 downloads in the last 90 days | MSRV 1.71.1
#   against our 1.98.1 | crate size 155,043 bytes.
#
#   Criterion 1 -- "verify no solution exists with current dependencies or the
#   std library". Nothing else in this tree parses CommonMark: `AGENTS.md` 4.2
#   names a mandatory test target of "markdown bold/italic/code/links, nested
#   formatting, never panics, injection safety", and `PLAN.md` 2 already lists
#   `pulldown-cmark` in the tech stack and 8 Phase 1 already names
#   `core/markdown.rs` as "Markdown to styled segment tree". Hand-rolling a
#   CommonMark parser is the exact case the criterion exists to exclude, and it
#   would be the one module in the workspace whose correctness is argued rather
#   than tested. This declaration closes a gap `PLAN.md` 2 had already recorded.
#
#   Criterion 2 -- maintained: released 2026-05-20, the most recent 0.13.x, and
#   the crate the entire Rust Markdown ecosystem (including Zed itself, whose
#   own markdown rendering is built on it) depends on.
#
#   Criterion 3 -- license: `MIT`, confirmed in BOTH the repository `LICENSE`
#   file and the published crate's `license` field. MIT is one of the licenses
#   `AGENTS.md` 7.2 names as compatible, and this project's own LICENSE is MIT
#   (root `Cargo.toml` `workspace.package.license`, which the `rstest` block
#   above records was corrected to match the LICENSE file).
#
#   Criterion 4 -- compile-time impact, and this is the figure that differs from
#   every other entry in this file: `AGENTS.md` 7.2's usual "no new compile
#   units, it was already in the tree via GPUI" argument does NOT apply. At 1C-1
#   `Cargo.lock` held no `pulldown-cmark` and no `unicase`; `bitflags 2.13.2`
#   and `memchr 2.8.3` were already present transitively. So the honest figure
#   is TWO new compile units -- `pulldown-cmark` itself and `unicase`, pulled
#   in by the `getopts` feature and needed for case-insensitive HTML tag-name
#   matching. Measured in the Phase 1 timings pass. Both are small, pure Rust,
#   no C, no build script, no proc-macros.
#
#   Criterion 5 -- justification comment: this one.
#
#   Feature choice: `default-features = false`, and this is the interesting
#   decision. The default set is `["getopts", "html"]`. `html` pulls
#   `pulldown-cmark-escape` and exists solely to serve `pulldown_cmark::html`,
#   the HTML *renderer* -- a thing this project does not have and must not want:
#   `PLAN.md` 2's row is "Markdown parsing into a styled segment tree", and
#   `ui/` renders GPUI elements, not HTML. Enabling it would add a dependency
#   whose sole purpose is to escape text for a renderer we do not ship.
#   `getopts` compiles a small command-line flag parser that is only reachable
#   from the crate's `pulldown-cmark` binary target, which a library dependency
#   does not build. Both stay off deliberately, and `getopts` being off does not
#   remove `unicase` (see the criterion-4 note: it is a non-optional runtime
#   dependency).
# ---------------------------------------------------------------------------
pulldown-cmark = { version = "0.13", default-features = false }
