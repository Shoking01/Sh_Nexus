[package]
name = "sh_nexus"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Sh_Nexus - native team chat client (Rust + GPUI)"

[[bin]]
name = "sh_nexus"
path = "src/main.rs"

[lib]
name = "sh_nexus"
path = "src/lib.rs"

[dependencies]
# tracing: structured logging. Audited per AGENTS.md 7.2 in the workspace
# `Cargo.toml`, and already in `Cargo.lock` at 0.1.44 through the server, so this
# names a dependency the workspace already links rather than adding one.
#
# Declared here because the client could not honour 7.5 without it: 7.5 requires
# `tracing` and 7.1 bans `println!`, and `main.rs` was carrying a `eprintln!` on
# the startup-failure path with a comment saying a project-wide logger would
# replace it. This is that. `network/ws.rs` deliberately logs **nothing** — it
# counts instead, and its counters are the observable surface — so this first use
# is the connection settings in `app.rs`.
tracing = { workspace = true }

# tracing-subscriber: the other half of the entry above, and the reason a
# `tracing::error!` is a log line rather than a no-op. `tracing` is a facade; with
# no subscriber installed every event it is handed is dropped on the floor, so
# `app.rs`'s two `tracing::error!` calls on the startup path — "the client has no
# socket", "the connection settings are incomplete" — reached nobody at all.
#
# NOT a new dependency. `Cargo.toml:263` of the workspace root already pins
# `tracing-subscriber = { version = "0.3", features = ["env-filter"] }` for
# `sh_nexus_server`, with the 7.2 audit written out in the comment above it: MIT
# OR Apache-2.0, the Rust logging standard, already in `Cargo.lock` and already
# compiled into this workspace's build graph. This line names a workspace member;
# it adds no crate, no licence to review and no compile unit to the workspace as a
# whole — the same argument the `tracing` line above makes about its own first
# use, and the same one `futures-util` makes below.
#
# `env-filter` is what makes `RUST_LOG` work, and it is not optional here:
# `AGENTS.md` 7.5 says "in release builds, the minimum level must be info (set via
# RUST_LOG or config)", which is a statement about a *filter* rather than about a
# subscriber. The feature was already declared workspace-wide for that reason.
tracing-subscriber = { workspace = true }

# gpui: platform-agnostic core of Zed's UI framework. Apache-2.0. Pinned to a
# `rev` rather than a semver range because the git channel expresses no
# version guarantee and every upstream sync must be a deliberate review, not a
# `cargo update` (PLAN.md ADR-001).
gpui = { workspace = true }

# gpui_platform: the OS-backend dispatcher. NOT optional -- since upstream
# commit "gpui: Extract gpui_platform out of gpui" (2026-02-19) the platform
# backends (gpui_apple/gpui_macos/gpui_linux/gpui_windows/gpui_wgpu) live
# outside `gpui`, so depending on `gpui` alone yields no window on Windows.
# `test-support` propagates to gpui/gpui_macos/gpui_windows/gpui_wgpu
# test-support and is what makes the headless test harness exist at all
# (PLAN.md section 10). Its `default` feature set is empty; Windows needs no
# other feature.
gpui_platform = { workspace = true, features = ["test-support"] }

# sh_nexus_wire: the protocol, shared with the server (ADR-002). A path
# dependency, not a version: both crates are in this workspace, are released
# together, and the whole point of ADR-002 is that they are one compiler
# invocation over one set of types. A version range would reintroduce the
# possibility of the two sides resolving different protocols.
#
# Note the direction: sh_nexus_wire does NOT depend on this crate. That is
# asserted by crates/sh_nexus_wire/tests/dependency_direction.rs, because a
# back-edge would make the protocol depend on one of its two implementations.
sh_nexus_wire = { path = "../sh_nexus_wire" }

# thiserror: `AGENTS.md` 3.3 defines ShNexusError as a `#[derive(Error)]` enum and
# 2.2 mandates thiserror. The audit is in the root Cargo.toml.
thiserror = { workspace = true }

# serde_json: `AGENTS.md` 2.2 mandates it, and it is the encoding sh_nexus_wire
# speaks, so this crate decodes the same JSON the wire crate encodes. Used in
# exactly three places: `errors.rs`, whose Serialization variant wraps
# `serde_json::Error` with a real `#[from]`; `core/theme.rs`, which parses a
# theme document's bytes with it and derives nothing; and the boundary tests.
#
# NOTE: this crate does NOT depend on `serde` itself. Nothing in the client
# derives Serialize or Deserialize -- that is the wire/domain boundary
# (`PLAN.md` section 5), and adding `serde` here would put the derive macros one
# `use` away from core/models. crates/sh_nexus/tests/layer_boundary.rs scans
# core/ for the word "serde" and admits exactly one spelling of it,
# `serde_json`; a `serde` dependency would make that scan fail for the right
# reason, and the check itself is
# `core_admits_serde_json_and_still_rejects_serde`.
serde_json = { workspace = true }

# chrono: `AGENTS.md` 2.1 requires chrono::DateTime<Utc> for every timestamp and
# forbids hand-formatted RFC-3339, and PLAN.md section 3 repeats it. Used by the
# domain models and by the boundary's timestamp validation.
#
# `clock` is the one feature beyond `std` and `serde`, and it is declared here
# rather than left to chance. `ui/views/input_bar.rs` calls `Utc::now()` on
# Enter: `state/` is given no clock by `AGENTS.md` 3.2 and `bridge.rs` states
# that the *caller* supplies the timestamp, so the composer is that caller and
# somebody has to read the clock. It already compiled before this line existed
# -- but only because gpui enables chrono's `default` features and Cargo
# unifies features per crate version, so this declaration was lying about what
# the crate needs. Relying on another crate's feature set is precisely the
# fragility the comment below used to describe; `docs/DEPENDENCIES.md` row 7
# records the audit.
chrono = { workspace = true, features = ["clock"] }

# uuid: `AGENTS.md` 7.4 requires a client-generated UUID as the client_msg_id, and
# PLAN.md section 5 types it `Uuid` in the domain where the wire carries a
# String. That split is what makes "must be a UUID" a rule the boundary can
# enforce and a test can check.
#
# `v4` is the first real generator, and it lives in `ui/views/input_bar.rs`:
# Enter mints the `client_msg_id` for the optimistic row, because `bridge.rs`
# states the bridge has no id source -- the caller mints it. `v4` implies
# `rng`, which is a `getrandom` call per id; that is one call per Enter, not a
# per-frame cost, and the alternative (`from_u128` off a counter) is an identity
# the server would have to trust.
#
# This feature was previously absent *by policy* -- the comment said `rng` "will
# be added when the first real generator lands, as its own justified change".
# That change is this one. The part worth recording is that `Uuid::new_v4()`
# compiled before it was declared, because gpui's tree enables `uuid/v4` and
# Cargo unifies features per crate version: our declaration was not the reason
# the code built. `docs/DEPENDENCIES.md` row 8 carries the audit.
uuid = { workspace = true, features = ["v4"] }

# smallvec: `AGENTS.md` 2.3 mandates it for small collections and names
# "reactions on a message" as the case; PLAN.md section 5 sizes the inline buffers
# at [Reaction; 2] and [Attachment; 1]. No dependencies, no build script, no C.
smallvec = { workspace = true }

# pulldown-cmark: `AGENTS.md` 4.2 names a mandatory test target of "markdown
# bold/italic/code/links, nested formatting, never panics, injection safety", and
# `PLAN.md` 2 already listed this crate in the tech stack. The full 7.2 audit --
# version, license, maintenance, download volume, compile-time delta, and the
# `default-features = false` decision -- is in the root Cargo.toml.
#
# A REGULAR dependency, not a dev-dependency, and that is load-bearing:
# `core/markdown.rs` is production code. `crates/sh_nexus/tests/layer_boundary.rs`
# keeps passing only because its `CORE_ALLOWED_CRATES` allow-list was widened
# with this crate, which is the point of an allow-list -- a crate added tomorrow
# is rejected until somebody adds it to the list and says why.
pulldown-cmark = { workspace = true }

# tokio-tungstenite: `AGENTS.md` 3.1's `network/websocket.rs`, and 7.4's
# transport rules (5s connect, 30s read keepalive, explicit rejection of an
# unknown major version). The audit -- version, license, maintenance, download
# volume, and the "no new compile units" argument -- is in the root manifest,
# including the note that tokio-tungstenite 0.29.0 was ALREADY in `Cargo.lock`
# through the server's `axum` `ws` feature. Defaults only: every TLS feature is
# off, deliberately, because a trust store and a TLS stack are ADR-010's next
# PR and shipping one without the other's audit is worse than shipping neither.
tokio-tungstenite = { workspace = true }

# tokio: named here rather than left to arrive through gpui and
# tokio-tungstenite, because `network/ws.rs` calls `tokio::time::{interval,
# timeout, sleep}`, `tokio::sync::{mpsc, Notify}` and `tokio::runtime::Builder` by
# name. The workspace entry already carries `rt-multi-thread`, `macros`, `net`,
# `sync` and `signal`; the three features added here are the ones this crate's
# own code names and the workspace entry did not.
#
#   `time`   -- the keepalive interval, the 5s connect timeout and the backoff
#               sleep. Every one of `AGENTS.md` 7.4's "timeouts on everything"
#               is this feature.
#   `rt`     -- `Builder::new_current_thread` for the one runtime the transport
#               thread owns. Implied by `rt-multi-thread` and declared anyway, for
#               the reason the `uuid/v4` and `chrono/clock` entries above give:
#               relying on another crate's feature set is the fragility those
#               comments were written to describe.
#   `io-util` -- nothing in `src/` names it. It is listed as NOT added, here, so
#               that the absence is recorded rather than inferred: if a future
#               work unit needs it, this is the comment it has to argue against.
tokio = { workspace = true, features = ["time", "rt"] }

# futures-util: `tokio-tungstenite` 0.29 exposes reading and writing ONLY
# through `futures_core::Stream` and `Sink`, and re-exports neither extension
# trait -- unlike `axum::extract::ws::WebSocket`, whose `recv`/`send` are inherent
# and which is why `sh_nexus_server` needs no futures dependency at all (see that
# crate's `src/ws.rs`, "How a connection is served"). So `StreamExt::next` and
# `SinkExt::send` are the two function names `network/ws.rs` needs, and they live
# in this crate.
#
#   Criterion 1: there is no std equivalent -- `std::future` has no `Stream`, and
#   a hand-written adapter would be a new module whose entire content is a poll
#   loop someone would have to review. Criterion 5: NO NEW COMPILE UNITS --
#   `futures-util` 0.3.34 is already in `Cargo.lock` through gpui's tree and is
#   already a dependency of tokio-tungstenite itself, so this is the third
#   declaration of a crate this workspace has always compiled.
#
#   Feature choice: `default-features = false` with `std`. The defaults add
#   `async-await` and `async-await-macro`, which exist for `.await` inside
#   combinator chains; `StreamExt::next` and `SinkExt::send` are plain functions
#   in the base crate. Nothing in `src/` uses the `async-await` syntax on a
#   combinator, and leaving it on would be an undeclared dependency on a
#   proc-macro crate.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# hyper: the HTTP protocol implementation behind `network/rest.rs`, which is
# `AGENTS.md` 3.1's client REST module and the one request the login view needs
# (`POST /auth/login`). The full 7.2 audit -- version, license, maintenance,
# download volume, the `client`/`http1` feature choice and why every TLS feature
# is off -- is in the root manifest.
#
# NOT a new crate: `docs/DEPENDENCIES.md:70` already audits `hyper` in one row
# with the server's own HTTP stack, because `sh_nexus_server` depends on it
# through `axum`. **The honest part of that claim is narrower than "costs nothing",
# and the root manifest states it in full:** every `cargo build --workspace`
# already compiled this crate, so there is no new compile unit for the workspace --
# but a `cargo build -p sh_nexus` now compiles it for the first time, the client
# binary links it, and the `client` feature (which a hyper *server* never needs)
# adds `want` and `try-lock` to `Cargo.lock`.
#
# The alternative considered and rejected is `reqwest`, and the reason is a
# decision rather than a preference: `docs/DEPENDENCIES.md:106` records that
# `ring` and `rustls` are absent from this project **by choice**, and `reqwest`
# arrives with a TLS backend attached. `AGENTS.md` 7.4's rule about never
# disabling certificate validation in a release build is a rule about a stack
# that does not exist yet, and adding the stack to deliver a login form would
# make the rule unauditable rather than satisfied.
hyper = { workspace = true }

# hyper-util: the connector, executor and pooling policy hyper 1.x deliberately
# does not ship. Without it `hyper` is a protocol implementation that cannot open
# a socket, so this is the other half of the dependency above rather than a
# convenience import. Audited in the root manifest, feature choice included.
hyper-util = { workspace = true }

# http-body-util: the only spelling of `Full<Bytes>` and of `BodyExt::collect`,
# which is what one POST body and one response body need. Audited in the root
# manifest; it is the third crate of `docs/DEPENDENCIES.md:70`'s "axum's HTTP
# stack" row to become a direct dependency of the client rather than a new row.
http-body-util = { workspace = true }

# keyring: the OS credential store, and the only sanctioned way this token is
# allowed to outlive the process. `AGENTS.md` 7.1 forbids plaintext storage and
# names the keychain as the replacement; 8.1's Login Flow expects it. Audited in
# the root manifest -- Apache-2.0, read from `LICENSE-APACHE` because crates.io
# leaves the field blank.
#
# Declared here rather than in the server: the token is the *client's* credential
# and the server must never see a keychain. This is also the crate that makes
# `platform/` exist -- it is the project's first, and `AGENTS.md` L88 already
# described what belongs in it.
keyring = { workspace = true }

[dev-dependencies]
# proptest: `AGENTS.md` 4.4 mandates it. Its property tests here cover the
# properties the hand-written cases cannot: that no wire value at all reaches
# state/ unvalidated, and that every valid value round-trips. Feature choice and
# the cost of a second copy of proptest (the first arrives via
# gpui_platform/test-support) are recorded in the root Cargo.toml.
proptest = { workspace = true }
rstest = { workspace = true }

[features]
# profiling: opens `gpui`'s `profiler` feature, which is what makes the frame
# histograms -- `Window::frame_duration_snapshot`, `WindowProfiler`'s
# `draw_duration` and `dirty_to_present` -- exist at all. It is a feature and
# not a plain dependency because `AGENTS.md` 6.1 measures the *release* binary
# and 6.2's frame-time row is a development measurement: compiling the
# instrumentation into every build would put measurement code in a product whose
# first priority is the frame it is measuring. Nothing in `src/` references it,
# so the cost of leaving it off is zero and the cost of turning it on is a
# histogram allocation per window.
#
# `dep:hdrhistogram` is *not* named here on purpose. `AGENTS.md` 7.2 prices a
# dependency by its compile time and supply-chain surface, and this crate never
# names that type: `benches/frame_time.rs` reads the histograms field by field
# through `FrameDurationSnapshot`, whose fields are public, which needs no
# import of the type behind them. Enabling `gpui/profiler` pulls `hdrhistogram`
# in as gpui's own optional dependency -- gpui's business, already audited
# there -- rather than as ours.
profiling = ["gpui/profiler"]

[[bench]]
# The ADR-006 step 6 measurement: scroll frame time at 10k messages against
# `AGENTS.md` 6.2's `< 8 ms`, plus two fixed idle dwells for an external RAM
# sample.
name = "frame_time"
# The bench opens a real window and drives a real frame loop, which `libtest`'s
# harness has no opinion about: it would run `main`, get a function that never
# returns a `Bencher`, and report nothing. The bench prints its own report.
harness = false
# Gated so that `cargo build`, `cargo test` and `cargo clippy` -- the commands
# `AGENTS.md` 5.1 makes mandatory -- never build an instrumented binary they do
# not run. The measurement is opt-in, exactly like the feature above.
required-features = ["profiling"]
